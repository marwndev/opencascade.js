    - symbol: Geom2d_Circle              # curved input for the general Geom2dGcc_* solvers (tangent-to-arc)
    - symbol: GccEnt_QualifiedCirc
    - symbol: GccEnt_QualifiedLin

    # ------------------------------------------------------------------
    # 2D Tangent-Constraint Solvers (Workstream A-2b — see GCCANA_PLAN.md)
    # ------------------------------------------------------------------
    # Recovered now that math_VectorBase<double> (= math_Vector) is bound.
    # GccAna_* are analytic (closed-form) line/circle tangency constructions;
    # Geom2dGcc_* are the general layer over arbitrary Geom2d curves — analytic
    # cases delegate to GccAna_*, general/iterative cases solve via Newton using
    # internal math_Vector-based functors (now compilable). None surface math_*
    # in their public embind API. FluidCAD uses these for parametric sketch
    # constraints (line/circle tangent to entities, tangent+radius/center, …).
    - symbol: GccEnt                      # qualifier factory (Unqualified/Outside/Enclosing/…)
    - symbol: Geom2dGcc_QCurve            # internal qualified-curve helper (Iter/Geo ctors)
    # Analytic (closed-form)
    - symbol: GccAna_Lin2d2Tan
    - symbol: GccAna_Lin2dTanObl
    - symbol: GccAna_Lin2dTanPar
    - symbol: GccAna_Lin2dTanPer
    - symbol: GccAna_Circ2d2TanOn
    - symbol: GccAna_Circ2d2TanRad
    - symbol: GccAna_Circ2d3Tan
    - symbol: GccAna_Circ2dTanCen
    - symbol: GccAna_Circ2dTanOnRad
    # General (over arbitrary 2D curves); *Geo/*Iter are the analytic/iterative
    # strategies the no-suffix solvers delegate to and expose via Results().
    - symbol: Geom2dGcc_Lin2d2Tan
    - symbol: Geom2dGcc_Lin2d2TanIter
    - symbol: Geom2dGcc_Lin2dTanObl
    - symbol: Geom2dGcc_Lin2dTanOblIter
    - symbol: Geom2dGcc_Circ2d2TanOn
    - symbol: Geom2dGcc_Circ2d2TanOnGeo
    - symbol: Geom2dGcc_Circ2d2TanOnIter
    - symbol: Geom2dGcc_Circ2d2TanRad
    - symbol: Geom2dGcc_Circ2d2TanRadGeo
    - symbol: Geom2dGcc_Circ2d3Tan
    - symbol: Geom2dGcc_Circ2d3TanIter
    - symbol: Geom2dGcc_Circ2dTanCen
    - symbol: Geom2dGcc_Circ2dTanCenGeo
    - symbol: Geom2dGcc_Circ2dTanOnRad
    - symbol: Geom2dGcc_Circ2dTanOnRadGeo

    # Geometry return types
    - symbol: Geom_Circle
    - symbol: Geom_TrimmedCurve

    # Other geometry types / enums
    - symbol: Poly_Polygon2D
    - symbol: GeomAbs_Shape

    # Shape Fix/Analysis
    - symbol: ShapeAnalysis_FreeBounds
    - symbol: ShapeExtend_WireData
    - symbol: ShapeFix_Shape
    - symbol: ShapeFix_Wire
    - symbol: ShapeFix_Face
    - symbol: ShapeUpgrade_UnifySameDomain

    # STEP I/O
    - symbol: STEPControl_Reader
    - symbol: STEPControl_Writer
    - symbol: STEPCAFControl_Reader
    - symbol: STEPCAFControl_Writer

    # STL I/O
    - symbol: StlAPI_Writer

    # XCAF (Color/Assembly)
    - symbol: TDocStd_Application
    - symbol: XCAFDoc_DocumentTool
    - symbol: XCAFDoc_ShapeTool
    - symbol: Quantity_Color
    - symbol: TCollection_ExtendedString
    - symbol: TDF_Label

    # Meshing/Visualization
    - symbol: Poly_Triangulation
    - symbol: Poly_Connect
    # Surface-based per-vertex normals from a triangulation (for Three.js smooth
    # shading). V8 home of the old StdPrs_ToolTriangulatedShape::ComputeNormals —
    # that utility moved from the (excluded) TKV3d/StdPrs visualization stack into
    # modeling (TKTopAlgo/BRepLib). Uses the face surface via UV nodes; writes
    # normals into the Poly_Triangulation (read back via .HasNormals()/.Normal(i)).
    - symbol: BRepLib_ToolTriangulatedShape

    # Misc Utilities
    - symbol: Bnd_Box
    - symbol: GProp_GProps
    - symbol: Message_ProgressRange
    - symbol: Precision
    - symbol: ChFi2d_FilletAPI
    - symbol: IntCurvesFace_ShapeIntersector
    - symbol: IntTools_EdgeEdge
    - symbol: IntTools_EdgeFace
    - symbol: Standard_Failure

    - symbol: Adaptor3d_CurveOnSurface
    - symbol: Bnd_Box2d
    - symbol: Bnd_OBB
    - symbol: BRepClass3d_SolidExplorer
    - symbol: BRepClass_Edge
    - symbol: BRepPrim_Cylinder
    - symbol: BRepPrim_Sphere
    - symbol: BRepSweep_Prism
    - symbol: BRepSweep_Revol
    - symbol: GeomAdaptor_Curve
    - symbol: GeomAdaptor_Surface
    # V8 base classes of BRepAdaptor_Curve/_Surface (BRepAdaptor_Curve : public
    # GeomAdaptor_TransformedCurve). embind can't construct a class whose base is
    # unregistered, so without these BRepAdaptor_Curve/_Surface are present-but-
    # unconstructable ("due to unbound types"). FluidCAD GAP 1 — see
    # FLUIDCAD_BINDING_FIXES.md. Bases (Adaptor3d_Curve/Surface) already linked.
