    - symbol: Extrema_ExtAlgo
    - symbol: BRepOffset_Mode
    - symbol: CDM_Document
    - symbol: XCAFDoc_ClippingPlaneTool
    - symbol: XCAFDoc_ColorTool
    - symbol: XCAFDoc_DimTolTool
    - symbol: XCAFDoc_GraphNode
    - symbol: XCAFDoc_LayerTool
    - symbol: XCAFDoc_MaterialTool
    - symbol: XCAFDoc_NotesTool
    - symbol: XCAFDoc_ViewTool
    - symbol: XCAFDoc_VisMaterialTool
    - symbol: XSControl_WorkSession
    - symbol: Law_Function
    - symbol: Poly_PolygonOnTriangulation
    - symbol: Poly_Polygon3D
    - symbol: BRepTools_History
    - symbol: Geom2d_Curve
    - symbol: Geom_CylindricalSurface
    - symbol: Geom_ConicalSurface
    - symbol: Geom2d_Line

    - symbol: IntTools_Context
    - symbol: BRepAlgoAPI_Section
    - symbol: IntTools_FaceFace

    # ==========================================
    # Multi-threading control (V8 addition)
    # ==========================================
    # Idiomatic V3 thread-pool control surface (replaces the old build's
    # emscripten-runtime PThread pool management). Lets callers do
    # `oc.OSD_ThreadPool.DefaultPool(-1)` per the fork's MT quickstart.
    - symbol: OSD_ThreadPool
    - symbol: OSD_ThreadPool_Launcher

    # ==========================================
    # Numeric geometry (Workstream A — TKMath)
    # ==========================================
    # math_VectorBase<double> == math_Vector (surfaced as oc.math_Vector via the
    # alias wrapper), plus math_Matrix + math_Gauss for linear algebra /
    # least-squares. Requires the from-source fork-patches build (see build.sh):
    # generic template discovery + the self-type-param codegen fix are NOT in the
    # stock image, so a plain `link` cannot resolve these symbols.
    - symbol: math_VectorBase_double
    - symbol: math_Matrix
    - symbol: math_Gauss

    # ==========================================
    # Projection (ProjLib — Workstream A-2c)
    # ==========================================
    # Project points/curves onto surfaces -> 2D parametric geometry (pcurves,
    # sketching on faces). Excluded in the first V8 cut for wasm-size only; the
    # ProjLib_* workers always compiled. See PROJLIB_PLAN.md.
    # Tier 1 — analytic (closed-form, no Approx machinery):
    - symbol: ProjLib                  # ProjLib::Project(Pln/Cylinder/Cone/Sphere/Torus, pnt|lin|circ|…)
    - symbol: ProjLib_Projector        # base of the analytic projectors
    - symbol: ProjLib_Plane
    - symbol: ProjLib_Cylinder
    - symbol: ProjLib_Cone
    - symbol: ProjLib_Sphere
    - symbol: ProjLib_Torus
    - symbol: ProjLib_ProjectOnPlane
    - symbol: ProjLib_ProjectOnSurface
    # Tier 2 — general curve -> surface -> 2D pcurve (pulls the Approx machinery):
    - symbol: ProjLib_ProjectedCurve
    - symbol: AppParCurves_Constraint  # enum (ProjectedCurve.SetBndPnt)
    - symbol: Geom2d_BoundedCurve      # base of the pcurve result types
    - symbol: Geom2d_BSplineCurve      # ProjLib_ProjectedCurve.BSpline() result
    - symbol: Geom2d_BezierCurve       # ProjLib_ProjectedCurve.Bezier() result
    # Edge pcurve types met when re-attaching pcurves for STEP export (BRep_Builder.UpdateEdge
    # rejects a Geom2d_Curve.Copy() result whose concrete class is not linked):
    - symbol: Geom2d_TrimmedCurve      # revolved-cone seam pcurves (extends Geom2d_BoundedCurve)
    - symbol: Geom2d_OffsetCurve       # offset pcurves (extends Geom2d_Curve)
    - symbol: Geom2d_Ellipse           # conic pcurves (extends Geom2d_Conic)
    - symbol: Geom2d_Hyperbola         # conic pcurves (extends Geom2d_Conic)
    - symbol: Geom2d_Parabola          # conic pcurves (extends Geom2d_Conic)

    # ==========================================
    # Helix construction (TKHelix — new in OCCT V8)
    # ==========================================
    # V8 added the TKHelix toolkit for parametric helix / spiral construction
    # (threads, springs, coils). Two layers, both wanted:
    #   * HelixBRep_BuilderHelix — top level: a gp_Ax3 + arrays of diameters /
    #     heights / pitches (or turns) -> a TopoDS_Shape helix wire, ready to be
    #     swept along (BRepOffsetAPI_MakePipe/Shell) for a thread or spring.
    #   * HelixGeom_* — the geometry layer: build the helix as Geom curves
    #     (HelixGeom_BuilderHelix on an arbitrary gp_Ax2, HelixGeom_BuilderHelixCoil
    #     on OZ; results read back via the base's Curves() as Handle(Geom_Curve)),
    #     HelixGeom_HelixCurve is the analytic Adaptor3d_Curve, and HelixGeom_Tools
    #     approximates a helix as a Geom_BSplineCurve.
    # libTKHelix.a is already linked (filterPackages admits it); listing these
    # symbols pulls the needed objects in and emits the embind glue. Every public
    # dependency is already bound — gp_Ax2/gp_Ax3, GeomAbs_Shape, TopoDS_Shape,
    # gp_Pnt/gp_Vec, Geom_Curve, Adaptor3d_Curve — and the container instantiations
    # (NCollection_Array1<double|bool>, NCollection_Sequence<Handle(Geom_Curve)>)
    # are auto-discovered. The lone gap is Geom_BSplineCurve (HelixGeom_Tools'
    # result type; its base Geom_BoundedCurve is already present). The one method
    # embind can't take, HelixGeom_BuilderApproxCurve::ApproxParameters (enum by
    # non-const ref), is already dropped in bindgen-filters.yaml.
    - symbol: Geom_BSplineCurve        # HelixGeom_Tools result type (3D B-spline)
    # Curve layer — bases first (ApproxCurve -> HelixGen -> concrete builders):
    - symbol: HelixGeom_BuilderApproxCurve   # abstract base (Curves()/tolerance/status)
    - symbol: HelixGeom_BuilderHelixGen      # base: helix curve parameters
    - symbol: HelixGeom_BuilderHelix         # concrete: helix on an arbitrary gp_Ax2
    - symbol: HelixGeom_BuilderHelixCoil     # concrete: single coil on axis OZ
    - symbol: HelixGeom_HelixCurve           # analytic helix Adaptor3d_Curve
    - symbol: HelixGeom_Tools                # static helix -> Geom_BSplineCurve approx
    # Wire layer — primary entry point for FluidCAD:
    - symbol: HelixBRep_BuilderHelix         # axis + params -> TopoDS_Shape helix wire
    - symbol: GCPnts_AbscissaPoint
    - symbol: Geom2dAPI_PointsToBSpline
    - symbol: Geom2dAPI_Interpolate
    - symbol: Geom_BoundedSurface      # base of Geom_BSplineSurface
    - symbol: Geom_BSplineSurface      # pole/knot surgery on loft side faces
    - symbol: GeomConvert              # analytic -> B-spline fallback
    # Swept-wall support composition and non-destructive topology history.
    # Array2<Handle(Geom_BezierSurface)> and HArray2<gp_Pnt> are discovered
    # from these algorithm signatures by the existing container generator.
    - symbol: Geom_BezierSurface
    - symbol: GeomConvert_BSplineSurfaceToBezierSurface
    - symbol: GeomConvert_CompBezierSurfacesToBSplineSurface
    - symbol: BRepBuilderAPI_Copy
    - symbol: BRepTools_ReShape
    # Native continuity subdivision for bounded boolean working faces.
    - symbol: ShapeBuild_ReShape
    - symbol: ShapeUpgrade_ShapeDivide
    - symbol: ShapeUpgrade_ShapeDivideContinuity
    - symbol: FluidCAD_Array2Access  # exact native point-grid getter omitted by template bindgen
    - symbol: GeomConvert_CurveToAnaCurve  # B-spline -> analytic recognition (projected sketch references)
    - symbol: GeomConvert_ConvType         # its conversion-mode enum
    - symbol: BRepBuilderAPI_Sewing    # restitch side faces with the caps
    - symbol: Geom_RectangularTrimmedSurface
    - symbol: BRep_ToolExt            # hand-written wrapper, see additionalCppCode below
    - symbol: ShapeCustomExt          # hand-written wrapper, see additionalCppCode below

  emccFlags:
    - -fwasm-exceptions
    - -sEXPORT_EXCEPTION_HANDLING_HELPERS
    - -sEXPORT_ES6=1
    - -sMODULARIZE
    - -sALLOW_MEMORY_GROWTH=1
    - -sEXPORTED_RUNTIME_METHODS=["FS","PThread"]
    - -sINITIAL_MEMORY=128MB
    - -sMAXIMUM_MEMORY=4GB
    - -sUSE_FREETYPE=1
    - -sERROR_ON_UNDEFINED_SYMBOLS=0
    - --no-entry
    - -Wl,--allow-undefined
    - --emit-symbol-map
    - -sSTACK_SIZE=8388608
    - -sWASM_BIGINT
    - -msimd128
    - -O3
    # ── Multi-threading additions (delta from the single-threaded full build) ──
    - -pthread
    - -sUSE_PTHREADS=1
    # Workers pre-spawned at init: the `pthreadPoolSize` init option when given,
    # else one per logical CPU. Emitted verbatim into PThread.initMainThread, where
    # `Module` is the options object passed to init(); quoted so Closure keeps the key.
    - "-sPTHREAD_POOL_SIZE=Module['pthreadPoolSize']??navigator.hardwareConcurrency"
    - -sSHARED_MEMORY=1
    - -sENVIRONMENT=web,worker,node

# Hand-written wrappers for OCCT overloads the generator cannot bind. Plain C++
# classes here get their Embind registration AND .d.ts declarations generated
# by the same pipeline as OCCT classes (out-params become result-object fields).
# Each class must ALSO be listed under mainBuild.bindings — the link and .d.ts
# stages select objects/fragments by that symbol list.
additionalCppCode: |
  #include <BRep_Tool.hxx>
  #include <BOPAlgo_ArgumentAnalyzer.hxx>
  #include <TopoDS_Edge.hxx>
  #include <TopoDS_Face.hxx>
  #include <Geom2d_Curve.hxx>
  #include <TopoDS_Shape.hxx>
  #include <BRepTools_Modifier.hxx>
  #include <BRepTools_Modification.hxx>
  #include <ShapeCustom.hxx>
  #include <ShapeCustom_DirectModification.hxx>
  #include <NCollection_DataMap.hxx>
  #include <TopTools_ShapeMapHasher.hxx>

  // BRep_Tool::CurveOnSurface(E, F, First, Last, Standard_Boolean* theIsStored)
  // carries a raw-pointer parameter, so the generator drops the face-form
  // overload (only the index-based one is bound). The face form is the one
  // that computes a pcurve on the fly for planar faces (which store none),
  // so FluidCAD's edge-on-face evaluations (normals at an edge, convexity)
  // need it. Exposed as BRep_ToolExt.CurveOnFace(E, F) -> { returnValue, First, Last }.
  class BRep_ToolExt {
  public:
    static Handle(Geom2d_Curve) CurveOnFace(const TopoDS_Edge& E, const TopoDS_Face& F,
                                            Standard_Real& First, Standard_Real& Last) {
      return BRep_Tool::CurveOnSurface(E, F, First, Last);
    }
  };

  // ShapeCustom::DirectFaces(S) rebuilds every face lying on an indirect
  // (left-handed) elementary surface onto its direct twin, but throws away the
  // BRepTools_Modifier it ran, so a caller tracking sub-shapes (an extruder's
  // start/end faces) cannot follow them into the result. ShapeCustom::
  // ApplyModifier exposes the modifier, but takes a Handle(BRepTools_Modification)
  // and an NCollection_DataMap the generator does not bind. Exposed as
  // ShapeCustomExt.DirectFaces(S, modifier): the caller's BRepTools_Modifier is
  // filled in place, and modifier.ModifiedShape(old) then yields each rebuilt
  // face / edge / vertex (or `old` itself when it was untouched).
  class ShapeCustomExt {
  public:
    static TopoDS_Shape DirectFaces(const TopoDS_Shape& S, BRepTools_Modifier& MD) {
      Handle(ShapeCustom_DirectModification) DM = new ShapeCustom_DirectModification();
      NCollection_DataMap<TopoDS_Shape, TopoDS_Shape, TopTools_ShapeMapHasher> context;
      return ShapeCustom::ApplyModifier(S, DM, context, MD);
    }
  };

