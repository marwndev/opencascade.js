    - symbol: ShapeUpgrade_UnifySameDomain
    - symbol: ShapeCustom               # DirectFaces: rebuild indirect (left-handed) elementary surfaces
    - symbol: BRepTools_Modifier        # rebuild history for ShapeCustomExt.DirectFaces (ModifiedShape)
    # Hidden-line-removal front end, used WITHOUT Hide(): sketch projection asks
    # HLRBRep_Algo for a face's outline (silhouette) edges against the sketch
    # normal — Update() runs the apparent-contour pass and splits the face
