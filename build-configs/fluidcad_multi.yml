    # FLUIDCAD_BINDING_FIXES.md. Bases (Adaptor3d_Curve/Surface) already linked.
    - symbol: GeomAdaptor_TransformedCurve
    - symbol: GeomAdaptor_TransformedSurface
    - symbol: gp_Ax22d
    - symbol: gp_Ax2d
    - symbol: gp_Dir2d
    - symbol: gp_Hypr
    - symbol: gp_Hypr2d
    - symbol: gp_Mat
    - symbol: gp_Parab
    - symbol: gp_Parab2d
    - symbol: GProp_PrincipalProps
    - symbol: gp_Trsf2d
    - symbol: gp_Vec2d
    - symbol: gp_XY
    - symbol: gp_XYZ
    - symbol: IMeshTools_Parameters
    - symbol: Message_Msg
