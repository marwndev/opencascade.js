# build-configs/fluidcad_multi.yml
#
# FluidCAD-specific multi-threaded build config: a curated ~302-symbol subset of
# the OCCT surface (vs. build-configs/full_multi.yml, which binds everything).
#
# It relies on the bindgen/filter changes on this branch's base
# (occt-v8-emscripten-5): generic template discovery binds math_VectorBase<double>
# (= math_Vector), and the previously-excluded surface that depends on it is
# re-included — the GccAna_*/Geom2dGcc_* 2D tangent-constraint solvers, the
# ProjLib projection package, and the BRepApprox/GeomInt walking-line
# approximators. Handle<T>/NCollection instantiations are auto-discovered at
# codegen time (and exposed under their mangled canonical names), so they are
# not listed here.
#
# Build (reuses the prebuilt deps in the V8 image — see ./build-fluidcad.sh):
#   ./build-fluidcad.sh
# Or natively from a full checkout (downloads deps via clone-deps.sh first):
#   ./build-wasm.sh --config multi-threaded full build-configs/fluidcad_multi.yml

